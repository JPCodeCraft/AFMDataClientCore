name: Validate shared core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/AFMDataClient.Core/AFMDataClient.Core.csproj -c Release
      - run: dotnet test tests/AFMDataClient.Core.Pow.Tests/AFMDataClient.Core.Pow.Tests.csproj -c Release
